<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 148" width="980" height="148" role="img" aria-label="Quatro citações de xadrez, alternadas a cada quatro segundos"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#191511"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient></defs><rect width="980" height="148" rx="9" fill="#0b0b0c"/><rect x="700" width="280" height="148" rx="9" fill="url(#sky)"/><circle cx="868" cy="61" r="37" fill="#d9b48d"/><path d="M640 142L740 83 773 112 824 66 888 118 932 99 980 124V148H640Z" fill="#171513" stroke="#9d8063" stroke-width="1"/><path d="M807 148V78M904 148V78M794 78H917L925 69H786Z M799 91H912" stroke="#0b0b0c" stroke-width="8" fill="#0b0b0c"/><path d="M24 36V20H44M648 112v16h-20" stroke="#b99b7e" fill="none" stroke-width="1.5"/><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.25;1" values="1;0;0"/><text x="40" y="51" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#f0deca"><tspan x="40" dy="0">“Qualquer grande jogador já se aperfeiçoou na análise independente.”</tspan></text><text x="40" y="112" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#c9aa88">— Mikhail Botvinnik</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;1" values="0;1;0;0"/><text x="40" y="51" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#f0deca"><tspan x="40" dy="0">“A maior parte do tempo gasto pensando é apenas para verificar</tspan><tspan x="40" dy="26">novamente o lance.”</tspan></text><text x="40" y="112" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#c9aa88">— Magnus Carlsen</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.75;1" values="0;1;0;0"/><text x="40" y="51" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#f0deca"><tspan x="40" dy="0">“Um plano ruim é melhor que a falta de um plano.”</tspan></text><text x="40" y="112" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#c9aa88">— Frank Marshall</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.75;1" values="0;1;1"/><text x="40" y="51" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#f0deca"><tspan x="40" dy="0">“Se o seu adversário oferecer empate, tente descobrir o porquê.”</tspan></text><text x="40" y="112" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#c9aa88">— Nigel Short</text></g><rect x=".5" y=".5" width="979" height="147" rx="9" fill="none" stroke="#4c4239"/></svg>